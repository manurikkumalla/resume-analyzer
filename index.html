<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATS Resume Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container py-5">
        <header class="text-center mb-5">
            <div class="icon-circle mb-3 mx-auto"><i class="fa-solid fa-file-invoice text-white fs-3"></i></div>
            <h1 class="fw-bold text-white">ATS Resume Analyzer Pro</h1>
            <p class="text-cyan">Optimize your resume against ATS search algorithms in real-time</p>
        </header>

        <div class="row g-4">
            <div class="col-lg-6">
                <div class="glass-card p-4 h-100">
                    <h5 class="fw-bold mb-3 text-white"><i class="fa-solid fa-keyboard text-cyan me-2"></i>Paste Data</h5>
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-medium">Resume Text</label>
                        <textarea id="resumeText" class="form-control bg-dark-input text-white" rows="6" placeholder="Paste your resume contents..." required></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-medium">Job Description</label>
                        <textarea id="jobText" class="form-control bg-dark-input text-white" rows="6" placeholder="Paste job descriptions..." required></textarea>
                    </div>
                    <button id="analyzeBtn" class="btn btn-cyan w-100 py-3 mt-2 fw-semibold">Analyze Resume</button>
                </div>
            </div>

            <div class="col-lg-6">
                <div class="glass-card p-4 h-100 d-flex flex-column">
                    <h5 class="fw-bold mb-4 text-white"><i class="fa-solid fa-square-poll-horizontal text-cyan me-2"></i>ATS Metrics</h5>
                    <div id="resultPlaceholder" class="text-center py-5 my-auto">
                        <i class="fa-solid fa-radar-chart fa-3x text-muted mb-3"></i>
                        <p class="text-muted">Fill both forms and click analyze to start scan.</p>
                    </div>
                    <div id="analysisContent" class="d-none">
                        <div class="d-flex align-items-center mb-4 pb-3 border-bottom border-secondary">
                            <div class="progress-circle-container me-4">
                                <svg class="progress-circle" viewBox="0 0 36 36">
                                    <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                                    <path id="circleProgress" class="circle" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                                </svg>
                                <div id="percentageText" class="percentage-label text-cyan fw-bold">0%</div>
                            </div>
                            <div>
                                <h4 class="fw-bold text-white mb-1" id="scoreRating">ATS Match Score</h4>
                                <p class="text-muted mb-0 small" id="scoreSummary">Optimize keywords to boost compatibility.</p>
                            </div>
                        </div>

                        <div class="row g-2 mb-4">
                            <div class="col-6"><div class="badge-card p-2 text-center"><small class="text-muted">Words</small><strong id="wordCountText" class="text-white d-block">0</strong></div></div>
                            <div class="col-6"><div class="badge-card p-2 text-center"><small class="text-muted">Complexity</small><strong id="readabilityText" class="text-white d-block">Medium</strong></div></div>
                        </div>

                        <div class="mb-4">
                            <h6 class="fw-semibold text-white mb-2"><i class="fa-solid fa-circle-check text-cyan me-2"></i>ATS Checklist</h6>
                            <ul id="checklistItems" class="list-unstyled mb-0 text-light-muted"></ul>
                        </div>

                        <div>
                            <h6 class="fw-semibold text-white mb-2"><i class="fa-solid fa-tags text-cyan me-2"></i>Key Missing Skills</h6>
                            <div id="keywordGaps" class="d-flex flex-wrap gap-2"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
